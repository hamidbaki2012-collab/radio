<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📻 Radio Live</title>

  <style>
    body {
      font-family: Arial;
      background: #1a2a6c;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    .logo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: white;
      margin: 20px auto;
      overflow: hidden;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .status {
      margin: 15px 0;
      font-size: 16px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      background: red;
    }

    .player {
      margin-top: 20px;
      padding: 15px;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      background: #00d2ff;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    <img src="logo.png" />
  </div>

  <h1>🎧 Radio Live</h1>

  <div class="status">
    <span id="statusDot" class="dot"></span>
    <span id="radioStatus">Chargement...</span>
    <br><br>
    👥 <span id="listeners">0</span> auditeurs
  </div>

  <div class="player">

    <audio id="player" preload="none">
      <source src="https://fpsnew2.listen2myradio.com:2199/listen.php?ip=212.84.160.3&port=9923&type=s1">
    </audio>

    <br><br>

    <button onclick="togglePlay()">▶ / ⏸ Play</button>

  </div>

</div>

<script src="radio.js"></script>

</body>
</html>
