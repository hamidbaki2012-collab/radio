<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>📻 Radio Bahá'ie</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, Arial;
  background-color: #1a2a6c;
  background-image:
    linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.5)),
    url('background.jpg'),
    url('background.png');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  color: white;
  text-align: center;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 480px;
  margin: auto;
}

.logo-container {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  overflow: hidden;
  margin: 20px auto;
  background: white;
}

.logo-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.status {
  margin: 15px 0;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 5px;
  background: red;
}

.player-box {
  background: rgba(255,255,255,0.1);
  padding: 20px;
  border-radius: 15px;
  backdrop-filter: blur(10px);
}

button {
  padding: 10px 20px;
  border: none;
  border-radius: 20px;
  background: #00d2ff;
  color: white;
  font-size: 16px;
  cursor: pointer;
}
.playing {
  background: #ff4b4b !important; /* rouge pause */
}

.not-playing {
  background: #00d2ff !important; /* bleu play */
}

#playBtn {
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 20px;
  cursor: pointer;
  transition: 0.2s;
}

/* ▶ PLAY = BLEU */
#playBtn.not-playing {
  background: #00d2ff !important;
}

/* ⏸ PAUSE = ROUGE */
#playBtn.playing {
  background: #ff4b4b !important;
}

  
/* VOLUME */
.volume-container {
  margin-top: 15px;
}

input[type=range] {
  width: 100%;
}
/* BOUTON UNIQUE */
#playBtn {
  background: #00d2ff !important;
  color: white;
  border: none;
  padding: 14px 40px;
  border-radius: 50px;
  font-size: 1.1rem;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}

/* PAUSE = ROUGE */
#playBtn.active {
  background: #ff4b4b !important;
}

  
</style>
</head>

<body>

<div class="container">

  <div class="logo-container">
    <img src="logo.png">
  </div>

  <h1>🎧 Radio Live</h1>

  <div class="status">
    <span id="statusDot" class="dot"></span>
    <span id="radioStatus">Chargement...</span>
    <br><br>
    👥 <span id="listenersBox">Live</span>
  </div>

  <div class="player-box">

    <audio id="player">
      <source src="https://fpsnew2.listen2myradio.com:2199/listen.php?ip=212.84.160.3&port=9923&type=s1">
    </audio>

    <br><br>

   <button id="playBtn" onclick="togglePlay()">▶ Play</button>

    <div class="volume-container">
      🔊 Volume
      <input type="range" min="0" max="100" value="70" id="volume">
    </div>
  </div>
</div>
<script src="radio.js"></script>
</body>
</html>
