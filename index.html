<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>📻 Radio Bahá'ie</title>

<style>
body {
  font-family: Arial;
  background-color: #1a2a6c;
  background-image:
    linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.5)),
    url('background.jpg');
  background-size: cover;
  background-position: center;
  color: white;
  background-repeat: no-repeat;
  background-size: cover;
  background-position: center;

  margin: 0;
  height: 100vh;

  display: flex;
  align-items: center;   /* ⬇️ pousse en bas */
  justify-content: center;
}

}

.container {
  max-width: 480px;
  margin: auto;
}

.status {
  margin: 15px 0;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 5px;
  background: red;
}

.player-box {
  background: rgba(255,255,255,0.1);
  padding: 20px;
  border-radius: 15px;
}

/* BOUTON */
#playBtn {
  background: #00d2ff;
  color: white;
  padding: 12px 30px;
  border-radius: 30px;
  border: none;
  cursor: pointer;
}

#playBtn.active {
  background: #ff4b4b;
}

/* VOLUME */
.volume-container {
  margin-top: 15px;
}

input[type=range] {
  width: 100%;
}

/* ONDE */
.radio-wave {
  display: none;
  justify-content: center;
  gap: 5px;
  margin-top: 15px;
}

.radio-wave.active {
  display: flex;
}

.wave {
  width: 6px;
  height: 25px;
  background: white;
  border-radius: 10px;
  animation: waveAnim 1s infinite ease-in-out;
}

.wave:nth-child(2) { animation-delay: 0.2s; }
.wave:nth-child(3) { animation-delay: 0.4s; }

@keyframes waveAnim {
  0%,100% { transform: scaleY(0.4); }
  50% { transform: scaleY(1.2); }
}
</style>
</head>

<body>

<div class="container">

  <h1>🎧 Radio Live</h1>

  <div class="status">
    <span id="statusDot" class="dot"></span>
    <span id="radioStatus">Hors ligne</span>
  </div>

  <div class="player-box">

    <audio id="player">
      <source src="https://fpsnew2.listen2myradio.com:2199/listen.php?ip=212.84.160.3&port=9923&type=s1">
    </audio>

    <br><br>

    <button id="playBtn">▶ Play</button>

    <div class="volume-container">
      🔊 Volume
      <input type="range" min="0" max="100" value="70" id="volume">
    </div>

    <!-- ONDE -->
    <div id="radioWave" class="radio-wave">
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
    </div>

  </div>

</div>

<script>
const player = document.getElementById("player");
const btn = document.getElementById("playBtn");
const dot = document.getElementById("statusDot");
const status = document.getElementById("radioStatus");
const wave = document.getElementById("radioWave");

// volume
document.getElementById("volume").addEventListener("input", e => {
  player.volume = e.target.value / 100;
});

// play / pause
btn.addEventListener("click", () => {

  if (player.paused) {

    player.play();

    // ✅ FORCER L’AFFICHAGE
    btn.classList.add("active");
    btn.textContent = "⏸ Pause";
    status.textContent = "En direct";
    dot.style.background = "#00ff88";
    wave.classList.add("active");

  } else {

    player.pause();

    // ✅ CACHER
    btn.classList.remove("active");
    btn.textContent = "▶ Play";
    status.textContent = "Hors ligne";
    dot.style.background = "#ff4b4b";
    wave.classList.remove("active");
  }
});

// états audio
player.addEventListener("playing", () => {
  btn.classList.add("active");
  btn.textContent = "⏸ Pause";
  status.textContent = "En direct";
  dot.style.background = "#00ff88";
  wave.classList.add("active");
});

player.addEventListener("pause", () => {
  btn.classList.remove("active");
  btn.textContent = "▶ Play";
  status.textContent = "Hors ligne";
  dot.style.background = "#ff4b4b";
  wave.classList.remove("active");
});

player.addEventListener("error", () => {
  status.textContent = "Erreur flux";
  dot.style.background = "orange";
  wave.classList.remove("active");
});
</script>

</body>
</html>
